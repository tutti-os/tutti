  <text x="72" y="590" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22">证据源：真实 Preferences API 与 Composer Options API；目标级记忆，不影响主模型选择。</text>
