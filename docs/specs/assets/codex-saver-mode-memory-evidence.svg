  <rect x="72" y="184" width="1296" height="330" rx="18" fill="#111a31" stroke="#334155"/>
  <text x="112" y="244" fill="#c4b5fd" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="26">featureFlags.lab.codexSaverMode = true</text>
  <text x="112" y="306" fill="#c4b5fd" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="26">agentComposerDefaultsByAgentTarget.local:codex.codexSaverMode = true</text>
  <text x="112" y="368" fill="#c4b5fd" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="26">composer.codexSaverModeSupported = true</text>
