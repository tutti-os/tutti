openapi: 3.0.3
info:
  title: Connector Market API Fragment
  version: 1.0.0
  description: Host-neutral connector catalog, installation, authorization, and global Agent-access contract.
tags:
  - name: connector-market
paths:
  /v1/connector-market:
    get:
      operationId: getConnectorMarket
      tags: [connector-market]
      summary: Get the authoritative connector-market snapshot
      responses:
        "200":
          description: Connector-market snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorMarketSnapshot"
        "400":
          $ref: "#/components/responses/ConnectorMarketInvalidRequestError"
        "401":
          $ref: "#/components/responses/ConnectorMarketUnauthorizedError"
        "503":
          $ref: "#/components/responses/ConnectorMarketUnavailableError"
  /v1/connector-market/categories:
    get:
      operationId: listConnectorMarketCategories
      tags: [connector-market]
      summary: List server-owned connector-market sections
      responses:
        "200":
          description: Connector-market sections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorMarketCategoriesResponse"
        "401":
          $ref: "#/components/responses/ConnectorMarketUnauthorizedError"
        "503":
          $ref: "#/components/responses/ConnectorMarketUnavailableError"
  /v1/connector-market/catalog:
    get:
      operationId: listConnectorMarketCatalog
      tags: [connector-market]
      summary: List one server-owned connector-market section
      parameters:
        - $ref: "#/components/parameters/ConnectorMarketSectionID"
        - $ref: "#/components/parameters/ConnectorMarketInstallationFilter"
        - $ref: "#/components/parameters/ConnectorMarketPageSize"
        - $ref: "#/components/parameters/ConnectorMarketPageToken"
      responses:
        "200":
          description: Connector-market section page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorMarketCatalogPage"
        "400":
          $ref: "#/components/responses/ConnectorMarketInvalidRequestError"
        "401":
          $ref: "#/components/responses/ConnectorMarketUnauthorizedError"
        "503":
          $ref: "#/components/responses/ConnectorMarketUnavailableError"
  /v1/connector-market/connectors/{connectorKey}:
    parameters:
      - $ref: "#/components/parameters/ConnectorMarketConnectorKey"
    get:
      operationId: getConnectorMarketConnector
      tags: [connector-market]
      summary: Get one connector projection
      responses:
        "200":
          description: Connector projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorMarketConnector"
        "400":
          $ref: "#/components/responses/ConnectorMarketInvalidRequestError"
        "401":
          $ref: "#/components/responses/ConnectorMarketUnauthorizedError"
        "404":
          $ref: "#/components/responses/ConnectorMarketNotFoundError"
        "503":
          $ref: "#/components/responses/ConnectorMarketUnavailableError"
  /v1/connector-market:refresh:
    post:
      operationId: refreshConnectorMarket
      tags: [connector-market]
      summary: Refresh and accept the upstream connector catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorMarketMutationRequest"
      responses:
        "202":
          description: Refresh operation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorMarketMutationResponse"
        "400":
          $ref: "#/components/responses/ConnectorMarketInvalidRequestError"
        "401":
          $ref: "#/components/responses/ConnectorMarketUnauthorizedError"
        "409":
          $ref: "#/components/responses/ConnectorMarketConflictError"
        "503":
          $ref: "#/components/responses/ConnectorMarketUnavailableError"
  /v1/connector-market/connectors/{connectorKey}:install:
    parameters:
      - $ref: "#/components/parameters/ConnectorMarketConnectorKey"
    post:
      operationId: installConnectorMarketConnector
      tags: [connector-market]
      summary: Install or update one connector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorMarketMutationRequest"
      responses:
        "202":
          description: Installation operation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorMarketMutationResponse"
        "400":
          $ref: "#/components/responses/ConnectorMarketInvalidRequestError"
        "401":
          $ref: "#/components/responses/ConnectorMarketUnauthorizedError"
        "404":
          $ref: "#/components/responses/ConnectorMarketNotFoundError"
        "409":
          $ref: "#/components/responses/ConnectorMarketConflictError"
        "422":
          $ref: "#/components/responses/ConnectorMarketUnprocessableError"
        "503":
          $ref: "#/components/responses/ConnectorMarketUnavailableError"
  /v1/connector-market/connectors/{connectorKey}:uninstall:
    parameters:
      - $ref: "#/components/parameters/ConnectorMarketConnectorKey"
    post:
      operationId: uninstallConnectorMarketConnector
      tags: [connector-market]
      summary: Uninstall one connector from this device
      description: >-
        Deactivates local runtime routes and removes the installed release and
        optional CLI. Account authorization is not disconnected and can be
        reused after reinstalling or from another device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorMarketMutationRequest"
      responses:
        "202":
          description: Uninstallation operation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorMarketMutationResponse"
        "400":
          $ref: "#/components/responses/ConnectorMarketInvalidRequestError"
        "401":
          $ref: "#/components/responses/ConnectorMarketUnauthorizedError"
        "404":
          $ref: "#/components/responses/ConnectorMarketNotFoundError"
        "409":
          $ref: "#/components/responses/ConnectorMarketConflictError"
        "503":
          $ref: "#/components/responses/ConnectorMarketUnavailableError"
  /v1/connector-market/connectors/{connectorKey}/runtime:
    parameters:
      - $ref: "#/components/parameters/ConnectorMarketConnectorKey"
    put:
      operationId: updateConnectorMarketConnectorRuntime
      tags: [connector-market]
      summary: Enable or disable an installed connector runtime
      description: >-
        Persists user activation independently from installation and account
        authorization. Disabling retires runtime routes without removing local
        files or authorization; enabling converges the installed release when
        authorization is ready.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorMarketRuntimeMutationRequest"
      responses:
        "202":
          description: Runtime activation intent accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorMarketConnector"
        "400":
          $ref: "#/components/responses/ConnectorMarketInvalidRequestError"
        "401":
          $ref: "#/components/responses/ConnectorMarketUnauthorizedError"
        "404":
          $ref: "#/components/responses/ConnectorMarketNotFoundError"
        "409":
          $ref: "#/components/responses/ConnectorMarketConflictError"
        "503":
          $ref: "#/components/responses/ConnectorMarketUnavailableError"
  /v1/connector-market/connectors/{connectorKey}/authorization:start:
    parameters:
      - $ref: "#/components/parameters/ConnectorMarketConnectorKey"
    post:
      operationId: startConnectorMarketAuthorization
      tags: [connector-market]
      summary: Start or replace connector authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorMarketAuthorizationRequest"
      responses:
        "200":
          description: Authorization attempt started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorMarketAuthorizationResponse"
        "400":
          $ref: "#/components/responses/ConnectorMarketInvalidRequestError"
        "401":
          $ref: "#/components/responses/ConnectorMarketUnauthorizedError"
        "404":
          $ref: "#/components/responses/ConnectorMarketNotFoundError"
        "409":
          $ref: "#/components/responses/ConnectorMarketConflictError"
        "503":
          $ref: "#/components/responses/ConnectorMarketUnavailableError"
  /v1/connector-market/connectors/{connectorKey}/authorization:cancel:
    parameters:
      - $ref: "#/components/parameters/ConnectorMarketConnectorKey"
    post:
      operationId: cancelConnectorMarketAuthorization
      tags: [connector-market]
      summary: Cancel a pending connector authorization attempt
      responses:
        "204":
          description: Pending authorization attempt canceled
        "401":
          $ref: "#/components/responses/ConnectorMarketUnauthorizedError"
        "404":
          $ref: "#/components/responses/ConnectorMarketNotFoundError"
        "503":
          $ref: "#/components/responses/ConnectorMarketUnavailableError"
  /v1/connector-market/connectors/{connectorKey}/authorization:disconnect:
    parameters:
      - $ref: "#/components/parameters/ConnectorMarketConnectorKey"
    post:
      operationId: disconnectConnectorMarketAuthorization
      tags: [connector-market]
      summary: Disconnect connector authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorMarketMutationRequest"
      responses:
        "202":
          description: Authorization disconnection accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorMarketMutationResponse"
        "400":
          $ref: "#/components/responses/ConnectorMarketInvalidRequestError"
        "401":
          $ref: "#/components/responses/ConnectorMarketUnauthorizedError"
        "404":
          $ref: "#/components/responses/ConnectorMarketNotFoundError"
        "409":
          $ref: "#/components/responses/ConnectorMarketConflictError"
        "503":
          $ref: "#/components/responses/ConnectorMarketUnavailableError"
  /v1/connector-market/operations/{operationID}:
    parameters:
      - $ref: "#/components/parameters/ConnectorMarketOperationID"
    get:
      operationId: getConnectorMarketOperation
      tags: [connector-market]
      summary: Get one durable connector-market operation
      responses:
        "200":
          description: Connector-market operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorMarketOperation"
        "400":
          $ref: "#/components/responses/ConnectorMarketInvalidRequestError"
        "401":
          $ref: "#/components/responses/ConnectorMarketUnauthorizedError"
        "404":
          $ref: "#/components/responses/ConnectorMarketNotFoundError"
        "503":
          $ref: "#/components/responses/ConnectorMarketUnavailableError"
components:
  parameters:
    ConnectorMarketConnectorKey:
      name: connectorKey
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9](?:[a-z0-9._-]{0,126}[a-z0-9])?$"
    ConnectorMarketOperationID:
      name: operationID
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ConnectorMarketSectionID:
      name: sectionId
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    ConnectorMarketInstallationFilter:
      name: installation
      in: query
      required: false
      description: Filters connector installation projections before page boundaries and next-page calculation.
      schema:
        type: string
        enum: [not_installed]
    ConnectorMarketPageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ConnectorMarketPageToken:
      name: pageToken
      in: query
      required: false
      schema:
        type: string
        minLength: 1
  responses:
    ConnectorMarketInvalidRequestError:
      description: Invalid connector-market request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConnectorMarketError"
    ConnectorMarketUnauthorizedError:
      description: Daemon authorization is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConnectorMarketError"
    ConnectorMarketNotFoundError:
      description: Connector or operation was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConnectorMarketError"
    ConnectorMarketConflictError:
      description: Revision conflict or operation already in progress
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConnectorMarketError"
    ConnectorMarketUnprocessableError:
      description: Connector is incompatible or its manifest cannot be installed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConnectorMarketError"
    ConnectorMarketUnavailableError:
      description: Connector-market capability is temporarily unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConnectorMarketError"
  schemas:
    ConnectorMarketCategory:
      type: object
      additionalProperties: false
      required: [categoryId, kind, sortOrder, itemCount]
      properties:
        categoryId:
          type: string
          minLength: 1
        kind:
          type: string
          enum: [category, featured]
        sortOrder:
          type: integer
          format: int32
        itemCount:
          type: integer
          format: int64
          minimum: 0
        displayNameZh:
          type: string
          minLength: 1
          description: Server-managed Simplified Chinese category name.
        displayNameEn:
          type: string
          minLength: 1
          description: Server-managed English category name.
    ConnectorMarketCategoriesResponse:
      type: object
      additionalProperties: false
      required: [categories]
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorMarketCategory"
    ConnectorMarketCatalogItem:
      type: object
      additionalProperties: false
      required: [categoryId, featured, connector]
      properties:
        categoryId:
          type: string
          minLength: 1
        featured:
          type: boolean
        connector:
          $ref: "#/components/schemas/ConnectorMarketConnector"
    ConnectorMarketCatalogPage:
      type: object
      additionalProperties: false
      required: [sectionId, items, revision]
      properties:
        sectionId:
          type: string
          minLength: 1
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorMarketCatalogItem"
        nextPageToken:
          type: string
        revision:
          type: integer
          format: int64
          minimum: 0
    ConnectorMarketSnapshot:
      type: object
      additionalProperties: false
      required: [catalogState, connectors, operations, revision, eventCursor]
      properties:
        catalogState:
          $ref: "#/components/schemas/ConnectorMarketCatalogState"
        connectors:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorMarketConnector"
        operations:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorMarketOperation"
        revision:
          type: integer
          format: int64
          minimum: 0
        eventCursor:
          type: integer
          format: int64
          minimum: 0
        sourceRevision:
          type: string
    ConnectorMarketConnector:
      type: object
      additionalProperties: false
      required:
        [key, release, installation, authorization, compatibility, revision]
      properties:
        key:
          type: string
        release:
          $ref: "#/components/schemas/ConnectorMarketRelease"
        installation:
          $ref: "#/components/schemas/ConnectorMarketInstallation"
        authorization:
          $ref: "#/components/schemas/ConnectorMarketAuthorization"
        compatibility:
          $ref: "#/components/schemas/ConnectorMarketCompatibility"
        runtime:
          $ref: "#/components/schemas/ConnectorMarketRuntime"
        revision:
          type: integer
          format: int64
          minimum: 0
    ConnectorMarketRelease:
      type: object
      additionalProperties: false
      required:
        [
          schemaVersion,
          releaseId,
          connectorKey,
          version,
          releaseDigest,
          manifestDigest,
          manifest,
          artifact,
          publishedAt,
          status
        ]
      properties:
        schemaVersion:
          type: string
          enum: ["1"]
        releaseId:
          type: string
          minLength: 1
        connectorKey:
          type: string
        version:
          type: string
        releaseDigest:
          type: string
          pattern: "^[a-f0-9]{64}$"
        manifestDigest:
          type: string
          pattern: "^[a-f0-9]{64}$"
        manifest:
          $ref: "#/components/schemas/ConnectorMarketManifest"
        artifact:
          $ref: "#/components/schemas/ConnectorMarketArtifact"
        publishedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [available, superseded]
    ConnectorMarketManifest:
      type: object
      additionalProperties: false
      required:
        [
          schemaVersion,
          displayName,
          iconUrl,
          permissions,
          implementation,
          authorizationKind
        ]
      properties:
        schemaVersion:
          type: string
          enum: ["1"]
        displayName:
          type: string
        iconUrl:
          type: string
          format: uri
          maxLength: 2048
          pattern: "^https://"
        description:
          type: string
        agentRouting:
          $ref: "#/components/schemas/ConnectorMarketAgentRouting"
        permissions:
          type: array
          items:
            type: string
        implementation:
          $ref: "#/components/schemas/ConnectorMarketImplementation"
        authorizationKind:
          type: string
        authorizationInteraction:
          type: object
          description: >-
            Opaque Connector-owned authorization interaction configuration.
            Hosts transport this value without interpreting its UI semantics;
            renderers must validate it against the versioned protocol.
          additionalProperties: true
        authorizationInteractionMode:
          type: string
          enum: [managed]
          description: >-
            Public host projection indicating that authorization is owned by a
            managed credential broker and must start without a local secret.
        compatibility:
          $ref: "#/components/schemas/ConnectorMarketCompatibilityRequirements"
    ConnectorMarketAgentRouting:
      type: object
      additionalProperties: false
      required: [aliases]
      properties:
        aliases:
          type: array
          minItems: 1
          maxItems: 12
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 48
    ConnectorMarketArtifact:
      type: object
      additionalProperties: false
      required: [key, sha256, sizeBytes, mediaType]
      properties:
        key:
          type: string
          minLength: 1
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
        mediaType:
          type: string
          minLength: 1
    ConnectorMarketCompatibilityRequirements:
      type: object
      additionalProperties: false
      properties:
        products:
          type: array
          items:
            type: string
        platforms:
          type: array
          items:
            type: string
        minimumHostVersion:
          type: string
    ConnectorMarketImplementation:
      type: object
      description: Public implementation discriminator; sensitive host configuration is never returned.
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [builtin, managed_stdio, remote_streamable_http]
    ConnectorMarketInstallation:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          $ref: "#/components/schemas/ConnectorMarketInstallationState"
        installedVersion:
          type: string
        installedAtUnixMs:
          type: integer
          format: int64
          minimum: 1
        installedReleaseId:
          type: string
        installedReleaseDigest:
          type: string
          pattern: "^[a-f0-9]{64}$"
        failureCode:
          type: string
    ConnectorMarketAuthorization:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          $ref: "#/components/schemas/ConnectorMarketAuthorizationState"
        failureCode:
          type: string
    ConnectorMarketCompatibility:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          $ref: "#/components/schemas/ConnectorMarketCompatibilityState"
        reason:
          type: string
    ConnectorMarketRuntime:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          type: string
          enum: [started, starting, stopped, failed]
        failureCode:
          type: string
    ConnectorMarketOperation:
      type: object
      additionalProperties: false
      required:
        [
          operationId,
          clientRequestId,
          kind,
          state,
          attempt,
          createdAt,
          updatedAt
        ]
      properties:
        operationId:
          type: string
        clientRequestId:
          type: string
        connectorKey:
          type: string
        kind:
          $ref: "#/components/schemas/ConnectorMarketOperationKind"
        state:
          $ref: "#/components/schemas/ConnectorMarketOperationState"
        stage:
          $ref: "#/components/schemas/ConnectorMarketOperationStage"
        target:
          $ref: "#/components/schemas/ConnectorMarketOperationTarget"
        attempt:
          type: integer
          format: int32
          minimum: 0
        failureCode:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ConnectorMarketOperationTarget:
      type: object
      additionalProperties: false
      required: [connectorKey, version, releaseId, releaseDigest]
      properties:
        connectorKey:
          type: string
        version:
          type: string
        releaseId:
          type: string
        releaseDigest:
          type: string
          pattern: "^[a-f0-9]{64}$"
        artifactSha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
    ConnectorMarketMutationRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId, expectedRevision]
      properties:
        clientRequestId:
          type: string
          minLength: 1
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
        expectedConnectorRevision:
          type: integer
          format: int64
          minimum: 0
    ConnectorMarketRuntimeMutationRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId, expectedRevision, enabled]
      properties:
        clientRequestId:
          type: string
          minLength: 1
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
        expectedConnectorRevision:
          type: integer
          format: int64
          minimum: 0
        enabled:
          type: boolean
    ConnectorMarketAuthorizationRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId, expectedRevision]
      properties:
        clientRequestId:
          type: string
          minLength: 1
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
        expectedConnectorRevision:
          type: integer
          format: int64
          minimum: 0
        replacementPolicy:
          $ref: "#/components/schemas/ConnectorMarketAuthorizationReplacementPolicy"
        secret:
          type: string
          minLength: 1
          maxLength: 16384
          writeOnly: true
    ConnectorMarketAuthorizationReplacementPolicy:
      type: string
      description: >-
        When set to replace_active, the Host fences and terminates a different
        unresolved authorization attempt before starting this request. Omission
        preserves the legacy resume-or-conflict behavior.
      enum: [replace_active]
    ConnectorMarketMutationResponse:
      type: object
      additionalProperties: false
      required: [operation, revision]
      properties:
        connector:
          $ref: "#/components/schemas/ConnectorMarketConnector"
        operation:
          $ref: "#/components/schemas/ConnectorMarketOperation"
        revision:
          type: integer
          format: int64
          minimum: 0
    ConnectorMarketAuthorizationResponse:
      type: object
      additionalProperties: false
      required: [connector, operation, authorizationExpiresAt, revision]
      properties:
        connector:
          $ref: "#/components/schemas/ConnectorMarketConnector"
        operation:
          $ref: "#/components/schemas/ConnectorMarketOperation"
        authorizationUrl:
          type: string
          format: uri
        authorizationView:
          type: object
          description: >-
            Opaque runtime Authorization View V1 envelope. Clients must validate
            it with the shared authorization protocol before rendering.
          additionalProperties: true
        authorizationExpiresAt:
          type: string
          format: date-time
        revision:
          type: integer
          format: int64
          minimum: 0
    ConnectorMarketConnectorResponse:
      type: object
      additionalProperties: false
      required: [connector, operation, revision]
      properties:
        connector:
          $ref: "#/components/schemas/ConnectorMarketConnector"
        operation:
          $ref: "#/components/schemas/ConnectorMarketOperation"
        revision:
          type: integer
          format: int64
          minimum: 0
    ConnectorMarketError:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          $ref: "#/components/schemas/ConnectorMarketErrorCode"
        message:
          type: string
        retryable:
          type: boolean
        revision:
          type: integer
          format: int64
          minimum: 0
    ConnectorMarketCatalogState:
      type: string
      enum: [ready, refreshing, stale, failed]
    ConnectorMarketInstallationState:
      type: string
      enum:
        [not_installed, installing, installed, updating, uninstalling, failed]
    ConnectorMarketAuthorizationState:
      type: string
      enum: [not_required, disconnected, pending, connected, expired, failed]
    ConnectorMarketCompatibilityState:
      type: string
      enum:
        [
          supported,
          unsupported_product,
          unsupported_platform,
          unsupported_version,
          unsupported_implementation
        ]
    ConnectorMarketOperationKind:
      type: string
      enum:
        - refresh_catalog
        - install
        - uninstall
        - start_authorization
        - disconnect_authorization
    ConnectorMarketOperationState:
      type: string
      enum: [accepted, running, completed, failed]
    ConnectorMarketOperationStage:
      type: string
      enum:
        - accepted
        - refreshing
        - installing
        - installed
        - runtime_pending
        - deactivating
        - removing
        - authorizing
        - disconnecting
        - completed
        - failed
    ConnectorMarketErrorCode:
      type: string
